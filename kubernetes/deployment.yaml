apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-data-finops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-data-finops-agent
  template:
    metadata:
      labels:
        app: cloud-data-finops-agent
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: agent
          image: REPLACE_WITH_REGISTRY/cloud-data-finops-agent:0.1.0
          args: ["doctor"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
